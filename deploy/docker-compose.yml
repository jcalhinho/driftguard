services:
  driftguard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"  # reach it through a reverse proxy or tunnel
    environment:
      - GITHUB_APP_PRIVATE_KEY_PATH=/app/driftguard-key.pem
      - DRIFTGUARD_DB=/data/driftguard.sqlite
    volumes:
      - ./driftguard-key.pem:/app/driftguard-key.pem:ro
      - driftguard-data:/data
    env_file:
      - ../app/.env

volumes:
  driftguard-data:
