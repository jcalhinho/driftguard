services:
  driftguard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
    volumes:
      - ./driftguard-key.pem:/app/driftguard-key.pem:ro
      - driftguard-data:/app/app
    env_file:
      - ../app/.env

volumes:
  driftguard-data:
