name: DriftGuard
description: Find breaking API usage (retired models, sunset endpoints, deprecated SDKs) and tell when the provider pages you watch change.
author: jcalhinho
branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Directory to scan
    default: "."
  min-severity:
    description: Lowest severity to report (info | warning | critical)
    default: warning
  fail-on-findings:
    description: Fail the job when at-risk usages are found
    default: "true"
  ignore:
    description: Space-separated glob patterns to skip, e.g. "tests/** docs/**"
    default: ""
  scan:
    description: Scan the code for breaking API usage
    default: "true"
  watch:
    description: Check the provider pages and source files listed under `watch` in .driftguard.yml against .driftguard.lock.json
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install DriftGuard
      shell: bash
      run: python -m pip install --quiet --disable-pip-version-check "$GITHUB_ACTION_PATH"
    - name: Scan
      if: inputs.scan == 'true'
      shell: bash
      env:
        DG_PATH: ${{ inputs.path }}
        DG_MIN: ${{ inputs.min-severity }}
        DG_FAIL: ${{ inputs.fail-on-findings }}
        DG_IGNORE: ${{ inputs.ignore }}
      run: |
        set -f  # keep glob patterns literal
        args=(scan "$DG_PATH" --format github --min-severity "$DG_MIN")
        for g in $DG_IGNORE; do args+=(--ignore "$g"); done
        [ "$DG_FAIL" = "true" ] || args+=(--no-fail)
        driftguard "${args[@]}"
    - name: Watch provider pages
      if: ${{ !cancelled() && inputs.watch == 'true' }}
      shell: bash
      env:
        DG_PATH: ${{ inputs.path }}
        DG_FAIL: ${{ inputs.fail-on-findings }}
      run: |
        args=(watch "$DG_PATH" --format github)
        [ "$DG_FAIL" = "true" ] || args+=(--no-fail)
        driftguard "${args[@]}"
