[project]
name = "driftguard"
version = "0.1.0"
description = "Le Dependabot des API : détecte les usages d'API cassants dans ton code."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
driftguard = "cli:main"

[tool.setuptools]
packages = ["engine", "app"]
py-modules = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
