# API breaking-change rules — format v1
#
# Each rule describes ONE breaking change of an API:
#
# id:        unique identifier (provider-slug)
# provider:  API provider
# title:     human-readable title of the breaking change
# severity:  info | warning | critical
# patterns:  regular expressions detecting the affected usage (one or more)
# fix_hint:  remediation advice shown in the issue/PR
# migration: link to the official migration guide
# replace:   (optional) safe mechanical replacement mapping {old: new}
# since:     date the rule was introduced (YYYY-MM-DD)

rules:
  - id: stripe-charges-api-deprecated
    provider: Stripe
    title: "The Charges API is deprecated — use Payment Intents"
    severity: critical
    patterns:
      - "stripe\\.charges\\.create"
      - "stripe\\.charges\\.retrieve"
      - "charges/create"
    fix_hint: "Replace with stripe.paymentIntents.create() and follow the migration guide."
    migration: "https://docs.stripe.com/payments/payment-intents/migration"
    replace:
      "stripe.charges.create": "stripe.paymentIntents.create"
      "stripe.charges.retrieve": "stripe.paymentIntents.retrieve"
    since: "2026-09-27"

  - id: stripe-sources-api-deprecated
    provider: Stripe
    title: "The Sources API is deprecated"
    severity: warning
    patterns:
      - "stripe\\.sources\\.create"
    fix_hint: "Migrate to Payment Methods (stripe.paymentMethods.create())."
    migration: "https://docs.stripe.com/payments/payment-methods"
    since: "2026-09-27"

  - id: openai-text-davinci-003-shutdown
    provider: OpenAI
    title: "The text-davinci-003 model has been shut down"
    severity: critical
    patterns:
      - "text-davinci-003"
      - "code-davinci-002"
    fix_hint: "Migrate to a recent model (gpt-4o, gpt-4o-mini) or a compatible one."
    migration: "https://platform.openai.com/docs/deprecations"
    since: "2026-09-27"

  - id: github-oauth-password-grant
    provider: GitHub
    title: "The OAuth password grant flow is disabled"
    severity: critical
    patterns:
      - "access_token\\?[^\"'\\s]*grant_type=password"
    fix_hint: "Migrate to the device flow or the web application flow."
    migration: "https://docs.github.com/en/apps/oauth-apps/building-oauth-apps/authorizing-oauth-apps"
    since: "2026-09-27"

  - id: github-auth-token-header
    provider: GitHub
    title: "The 'Authorization: token' header is deprecated in favor of Bearer"
    severity: info
    patterns:
      - "Authorization['\"]?\\s*[:=]\\s*['\"]?token\\s"
    fix_hint: "Use 'Authorization: Bearer <token>' instead."
    migration: "https://github.blog/2021-04-05-behind-githubs-new-authentication-token-formats/"
    since: "2026-09-27"

  - id: slack-rtm-start-deprecated
    provider: Slack
    title: "rtm.start is deprecated — use rtm.connect"
    severity: warning
    patterns:
      - "rtm\\.start"
    fix_hint: "Call rtm.connect, then open the returned WebSocket."
    migration: "https://api.slack.com/methods/rtm.connect"
    replace:
      "rtm.start": "rtm.connect"
    since: "2026-09-27"

  - id: slack-legacy-tokens
    provider: Slack
    title: "Legacy tokens (xoxp-/xoxo-) have been retired"
    severity: critical
    patterns:
      - "xoxp-[A-Za-z0-9-]+"
      - "xoxo-[A-Za-z0-9-]+"
    fix_hint: "Create a new Slack app and use xoxb- tokens with minimal scopes."
    migration: "https://api.slack.com/authentication/token-types"
    since: "2026-09-27"

  - id: twilio-lookups-v1-deprecated
    provider: Twilio
    title: "Lookups v1 API is deprecated in favor of v2"
    severity: warning
    patterns:
      - "/v1/PhoneNumbers"
      - "lookups\\.v1"
    fix_hint: "Migrate to the Lookups v2 API."
    migration: "https://www.twilio.com/docs/lookups/api"
    since: "2026-09-27"

  - id: openai-legacy-completions-endpoint
    provider: OpenAI
    title: "The legacy /completions endpoint is being phased out"
    severity: warning
    patterns:
      - "openai\\.completions\\.create"
      - "openai\\.Completion\\.create"
    fix_hint: "Migrate to the Chat Completions API (client.chat.completions.create)."
    migration: "https://platform.openai.com/docs/deprecations"
    since: "2026-09-27"

  - id: sendgrid-apikey-basic-auth
    provider: SendGrid
    title: "The v2 API (basic auth 'apikey') has been retired — use v3 Bearer"
    severity: warning
    patterns:
      - "v2/mail/send"
      - "sendgrid\\./v2"
    fix_hint: "Migrate to the v3 API with 'Authorization: Bearer SG.…'."
    migration: "https://docs.sendgrid.com/for-developers/sending-email/upgrade-your-authentication-method-to-api-keys"
    since: "2026-09-27"

  - id: aws-s3-path-style-deprecated
    provider: AWS
    title: "S3 path-style URLs are deprecated"
    severity: info
    patterns:
      - "https://s3\\.amazonaws\\.com/"
      - "https://[a-z0-9-]+\\.s3\\.amazonaws\\.com/"
    fix_hint: "Migrate to virtual-hosted style (bucket.s3.region.amazonaws.com)."
    migration: "https://aws.amazon.com/blogs/aws/amazon-s3-path-deprecation-plan-the-rest-of-the-story/"
    since: "2026-09-27"

  - id: stripe-pinned-old-api-version
    provider: Stripe
    title: "Stripe API version pinned to an old year"
    severity: info
    patterns:
      - "api_version[\"']?\\s*[:=]\\s*[\"']201[0-9]-"
    fix_hint: "Pin a recent API version and test the upgrade."
    migration: "https://docs.stripe.com/upgrades"
    since: "2026-09-27"

  - id: twilio-basic-auth-url-credentials
    provider: Twilio
    title: "Twilio credentials in plain text inside the URL (AC…:token@)"
    severity: warning
    patterns:
      - "https://AC[0-9a-f]{32}:[^@\\s\"']+@"
    fix_hint: "Use SDK-managed HTTP Basic auth — never embed credentials in the URL."
    migration: "https://www.twilio.com/docs/iam/credentials/api"
    since: "2026-09-27"
